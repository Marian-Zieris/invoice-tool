[project]
name = "invoice-saas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.6.0",
    "email-validator>=2.1.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "opencv-python-headless>=4.9.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "rapidocr-onnxruntime>=1.4.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "pyjwt>=2.8.0",
    "openai>=1.50.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
# Testovací závislosti - záměrně mimo hlavní seznam, aby se produkční image
# (viz Dockerfile, `uv pip install --system -r pyproject.toml`) nezvětšoval
# o nic, co appka za běhu nepotřebuje. CI (.github/workflows/ci.yml) si je
# instaluje zvlášť dovnitř jednorázového kontejneru.
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]