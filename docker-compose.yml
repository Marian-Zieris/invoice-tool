services:
  db:
    image: postgres:15-alpine
    container_name: invoice_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    container_name: invoice_web
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Žádný "ports" mapping záměrně - v produkci smí na backend chodit jen
    # frontend kontejner přes interní docker síť (nginx tam proxy_pass-uje
    # na "web:8000"). Publikovaný port 8000 by šel použít k obejití nginx a
    # podvržení X-Forwarded-For pro rate limiter (viz app/rate_limit.py) i
    # k přímému volání API bez HTTPS, i když appka jinak běží jen na 443.
    # Pro lokální vývoj/curl je "8000:8000" v docker-compose.override.yaml.
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - excel_templates_data:/app/excel_templates
    depends_on:
      db:
        condition: service_healthy
    restart: always

  backup:
    image: postgres:15-alpine
    container_name: invoice_backup
    env_file:
      - .env
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Denní pg_dump smyčka přímo v kontejneru - žádný cron na hostiteli
    # není potřeba, záloha běží jako součást "docker compose up". Zálohy
    # jsou lokální (na stejném droplet-u) - viz DEPLOYMENT.md pro doporučení
    # kopírovat je i mimo droplet (např. DigitalOcean Spaces přes rclone).
    entrypoint: ["sh", "-c", "while true; do sh /scripts/backup_db.sh; sleep 86400; done"]
    restart: always

  frontend:
    build: ./frontend
    container_name: invoice_frontend
    # Žádný "ports" mapping záměrně - v produkci je jediný vstup zvenku Caddy
    # (docker-compose.prod.yml), který terminuje HTTPS a proxuje sem přes
    # interní síť. Pro lokální vývoj je "5173:80" v docker-compose.override.yaml.
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  uploads_data:
  exports_data:
  excel_templates_data:
  db_backups:
