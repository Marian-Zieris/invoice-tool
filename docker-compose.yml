services:
  db:
    image: postgres:15-alpine
    container_name: invoice_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    container_name: invoice_web
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Žádný "ports" mapping záměrně - v produkci smí na backend chodit jen
    # frontend kontejner přes interní docker síť (nginx tam proxy_pass-uje
    # na "web:8000"). Publikovaný port 8000 by šel použít k obejití nginx a
    # podvržení X-Forwarded-For pro rate limiter (viz app/rate_limit.py) i
    # k přímému volání API bez HTTPS, i když appka jinak běží jen na 443.
    # Pro lokální vývoj/curl je "8000:8000" v docker-compose.override.yaml.
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
      - excel_templates_data:/app/excel_templates
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: invoice_frontend
    ports:
      - "5173:80"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  uploads_data:
  exports_data:
  excel_templates_data:
